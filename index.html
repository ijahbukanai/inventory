  const { loading: loadingProducts, data: productsData } = useFetch(() => fbGetProducts(), []);
  const products = useMemo(() => (productsData && productsData.success ? productsData.data : []), [productsData]);
  const prodById = useMemo(() => products.reduce((m, p) => (m[p.id] = p, m), {}), [products]);
  const codeIndex = useMemo(() => buildCodeIndex(products), [products]);
  const { data: custData } = useFetch(() => fbGetCustomers(), []);
  const customers = useMemo(() => (custData && custData.success ? custData.data : []), [custData]);
  const customerOpts = useMemo(() => customers.map(c => ({ value: c.id, label: c.name + (c.phone ? ' · ' + c.phone : '') })), [customers]);
  const { loading: loadingMovements, data: movementsData } = useFetch(() => fbGetStockMovements(), [reloadKey]);
  const movements = useMemo(() => (movementsData && movementsData.success ? movementsData.data : []), [movementsData]);
  // gate scanning until both loads land - scanning against a still-empty movements array
  // would make computeQtyOnHand read 0 and falsely reject the very first scan as out-of-stock
  const catalogReady = !loadingProducts && !loadingMovements;

  useEffect(() => { if (catalogReady && !completedSale && !showCamera && scanRef.current) scanRef.current.focus(); }, [catalogReady, completedSale, showCamera, cart]);

  const capacityCheck = useCallback((productId, name, nextQty) => {
    const onHand = computeQtyOnHand(productId, movements);
    if (nextQty > onHand) {
      Swal.fire({ icon: 'warning', title: 'Not enough stock', text: `Only ${onHand} unit(s) of ${name} in stock.` });
      return false;
    }
    return true;
  }, [movements]);

  const addToCart = useCallback((product, qtyToAdd) => {
    setCart(prev => {
      const existing = prev.find(l => l.productId === product.id);
      const nextQty = (existing ? existing.qty : 0) + qtyToAdd;
      if (!capacityCheck(product.id, product.name, nextQty)) return prev;
      if (existing) return prev.map(l => l.productId === product.id ? { ...l, qty: nextQty } : l);
      return [...prev, { productId: product.id, name: product.name, sku: product.sku, price: Number(product.price) || 0, qty: qtyToAdd }];
    });
  }, [capacityCheck]);

  const resolveAndAddToCart = useCallback(async (rawCode) => {
    const code = String(rawCode || '').trim();
    if (!code) return;
    if (!catalogReady) { Swal.fire({ icon: 'warning', title: 'Still Loading', text: 'Catalog is still loading, try again in a moment.' }); return; }
    const local = codeIndex.get(code.toLowerCase()); // instant - no network round-trip per scan
    if (local) { addToCart(local, 1); return; }
    const res = await fbFindProductByCode(code); // miss: product may be newer than our cached catalog
    if (!res.success) { Swal.fire({ icon: 'error', title: 'Not Found', text: res.message || `No product matches "${code}"` }); return; }
    addToCart(res.data, 1);
  }, [addToCart, catalogReady, codeIndex]);

  const handleScanSubmit = (e) => {
    e.preventDefault();
    const code = scanValue;
    setScanValue('');
    resolveAndAddToCart(code);
  };

  const handleDetected = (decodedText) => { setShowCamera(false); resolveAndAddToCart(decodedText); };

  const changeQty = (productId, delta) => {
    setCart(prev => {
      const line = prev.find(l => l.productId === productId);
      if (!line) return prev;
      const nextQty = line.qty + delta;
      if (nextQty <= 0) return prev.filter(l => l.productId !== productId);
      if (!capacityCheck(productId, line.name, nextQty)) return prev;
      return prev.map(l => l.productId === productId ? { ...l, qty: nextQty } : l);
    });
  };

  const removeLine = (productId) => setCart(prev => prev.filter(l => l.productId !== productId));

  const totals = useMemo(() => computeSaleTotals(cart, prodById, { type: discountType, value: discountValue }), [cart, prodById, discountType, discountValue]);
  const itemCount = useMemo(() => cart.reduce((s, l) => s + l.qty, 0), [cart]);
  const changeDue = paymentMethod === 'Cash' ? Math.max(0, (Number(tendered) || 0) - totals.grand) : 0;

  const persistHeld = (list) => { setHeld(list); localStorage.setItem('pos_held', JSON.stringify(list)); };
  const resetSale = () => { setCart([]); setCustomerId(''); setDiscountValue(''); setDiscountType('flat'); setPaymentMethod('Cash'); setTendered(''); };

  // park the current cart (customer + discount too) to localStorage, then clear the till
  const holdSale = () => {
    if (!cart.length) return;
    const cust = customers.find(c => c.id === customerId);
    const label = (cust ? cust.name : 'Walk-in') + ' · ' + cart.reduce((n, l) => n + l.qty, 0) + ' item(s) · ' + money(totals.grand);
    persistHeld([...held, { id: Date.now(), label, cart, customerId, discountType, discountValue, ts: nowIso() }]);
    resetSale();
    Swal.fire({ icon: 'success', title: 'Held', text: 'Sale parked — recall it anytime.', timer: 1400, showConfirmButton: false });
  };

  const recallHeld = async () => {
    if (!held.length) { Swal.fire({ icon: 'info', title: 'No held sales' }); return; }
    const opts = {}; held.forEach((h, i) => opts[i] = h.label);
    const { value } = await Swal.fire({ title: 'Recall a held sale', input: 'select', inputOptions: opts, inputPlaceholder: 'Pick one', showCancelButton: true, confirmButtonText: 'Recall' });
    if (value == null) return;
    const h = held[Number(value)]; if (!h) return;
    setCart(h.cart || []); setCustomerId(h.customerId || ''); setDiscountType(h.discountType || 'flat'); setDiscountValue(h.discountValue || '');
    persistHeld(held.filter((_, i) => i !== Number(value)));
  };

  const handleCheckout = async () => {
    if (cart.length === 0) return;
    if (paymentMethod === 'Cash' && (Number(tendered) || 0) < totals.grand) {
      const go = await Swal.fire({ icon: 'warning', title: 'Short payment', text: `Tendered is less than ${money(totals.grand)}. Continue anyway?`, showCancelButton: true, confirmButtonText: 'Yes, continue' });
      if (!go.isConfirmed) return;
    }
    if (paymentMethod === 'Credit' && !customerId) { Swal.fire({ icon: 'warning', title: 'Pick a customer', text: 'Credit sales must be tied to a customer.' }); return; }
    setLoad('Processing sale...');
    const cust = customers.find(c => c.id === customerId);
    const sale = {
      items: totals.lines, subtotal: totals.subtotal, discount: totals.discount, discountType, tax: totals.tax, total: totals.grand,
      paymentMethod, amountTendered: paymentMethod === 'Cash' ? (Number(tendered) || 0) : (paymentMethod === 'Credit' ? 0 : totals.grand), changeDue: round2(changeDue),
      customerId: customerId || '', customerName: cust ? cust.name : 'Walk-in', status: paymentMethod === 'Credit' ? 'credit' : 'completed'
    };
    const res = await fbCreateSale(sale, user);
    setLoad('');
    if (res.success) {
      setCompletedSale(res.data);
      resetSale();
      setReloadKey(k => k + 1);
      Swal.fire({ icon: 'success', title: 'Sale Complete', text: `${res.data.invoiceNo || ''} — ${money(res.data.total)}`, timer: 1800, showConfirmButton: false });
    } else {
      Swal.fire({ icon: 'error', title: 'Checkout Failed', text: res.message });
    }
  };

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-cash-register"></i> QR Sales / POS</h2>
        <div className="pos-scan-actions">
          <button className="btn btn-secondary" disabled={!catalogReady} onClick={() => setShowCamera(true)}><i className="fas fa-camera"></i> <span className="btn-label">Camera</span></button>
          <button className="btn btn-secondary" onClick={recallHeld}><i className="fas fa-clock-rotate-left"></i> <span className="btn-label">Held{held.length ? ` (${held.length})` : ''}</span></button>
        </div>
      </div>

      <form className="pos-scan-box" onSubmit={handleScanSubmit}>
        <div className="form-group">
          <label><i className="fas fa-barcode"></i> Scan or type SKU / Product Code</label>
          <input ref={scanRef} type="text" className="pos-scan-input" autoFocus disabled={!catalogReady} value={scanValue}
            onChange={(e) => setScanValue(e.target.value)} placeholder={catalogReady ? 'Scan barcode/QR or type code, then press Enter' : 'Loading catalog...'} />
        </div>
        <button type="submit" className="btn btn-primary" disabled={!catalogReady}><i className="fas fa-plus"></i> Add</button>
      </form>

      <div className="pos-grid">
        <div>
          {loadingProducts ? <TableSkeleton rows={4} columns={4} /> : <Cart items={cart} onInc={(id) => changeQty(id, 1)} onDec={(id) => changeQty(id, -1)} onRemove={removeLine} />}
        </div>
        <div className="pos-summary">
          <SearchableDropdown label="Customer" icon="fas fa-user" options={customerOpts} value={customerId} onChange={setCustomerId} placeholder="Walk-in customer" />
          <div className="pos-disc-row">
            <SearchableDropdown label="Discount" icon="fas fa-tags" options={DISCOUNT_TYPE_OPTS} value={discountType} onChange={setDiscountType} placeholder="Amount" />
            <div className="form-group"><label>Value</label><input type="number" min="0" step="0.01" placeholder="0" value={discountValue} onChange={(e) => setDiscountValue(e.target.value)} /></div>
          </div>
          <SearchableDropdown label="Payment" icon="fas fa-money-bill-wave" options={PAYMENT_OPTS} value={paymentMethod} onChange={setPaymentMethod} placeholder="Cash" />
          {paymentMethod === 'Cash' && <div className="form-group"><label>Amount Tendered</label><input type="number" min="0" step="0.01" value={tendered} onChange={(e) => setTendered(e.target.value)} /></div>}
          <div className="pos-summary-row"><span>Items</span><span>{itemCount}</span></div>
          <div className="pos-summary-row"><span>Subtotal</span><span>{money(totals.subtotal)}</span></div>
          {totals.discount > 0 && <div className="pos-summary-row"><span>Discount</span><span>- {money(totals.discount)}</span></div>}
          {totals.tax > 0 && <div className="pos-summary-row"><span>Tax{CFG.taxInclusive ? ' (incl)' : ''}</span><span>{money(totals.tax)}</span></div>}
          <div className="pos-summary-row grand"><span>Grand Total</span><span>{money(totals.grand)}</span></div>
          {paymentMethod === 'Cash' && (Number(tendered) || 0) > 0 && <div className="pos-summary-row"><span>Change</span><span>{money(changeDue)}</span></div>}
          <div className="pos-checkout-actions">
            <button className="btn btn-secondary" disabled={cart.length === 0} onClick={holdSale}><i className="fas fa-pause"></i> Hold</button>
            <button className="btn btn-success" disabled={cart.length === 0} onClick={handleCheckout}><i className="fas fa-check"></i> Checkout</button>
          </div>
        </div>
      </div>

      {showCamera && <CameraScanModal onDetected={handleDetected} onClose={() => setShowCamera(false)} />}
      {completedSale && <ThermalReceiptOverlay sale={completedSale} onClose={() => setCompletedSale(null)} />}
    </div>
  );
}

// --- Process Return (against a past sale) ---
function ReturnModal({ sale, returns, user, onClose, onDone }) {
  const already = useMemo(() => (sale.items || []).map(it => computeReturnedQty(sale.id, it.productId, returns)), [sale, returns]);
  const [qtys, setQtys] = useState(() => (sale.items || []).map(() => 0));
  const [saving, setSaving] = useState(false);

  const remaining = (idx) => sale.items[idx].qty - already[idx];
  const setQty = (idx, val) => {
    const max = remaining(idx);
    const v = Math.max(0, Math.min(max, Number(val) || 0));
    setQtys(prev => prev.map((q, i) => i === idx ? v : q));
  };

  const totalRefund = useMemo(() => qtys.reduce((s, q, i) => s + q * sale.items[i].price, 0), [qtys, sale.items]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    const items = sale.items
      .map((it, i) => ({ productId: it.productId, name: it.name, sku: it.sku, qty: qtys[i], price: it.price, lineTotal: qtys[i] * it.price }))
      .filter(it => it.qty > 0);
    if (!items.length) return Swal.fire({ icon: 'warning', title: 'Nothing Selected', text: 'Enter a return quantity for at least one item' });
    setSaving(true);
    const result = await fbCreateReturn(sale.id, items, user);
    setSaving(false);
    if (result.success) {
      Swal.fire({ icon: 'success', title: 'Return Processed', text: 'Refund: ' + money(totalRefund), timer: 2000, showConfirmButton: false });
      onDone();
    } else {
      Swal.fire({ icon: 'error', title: 'Error', text: result.message });
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3><i className="fas fa-rotate-left"></i> Process Return - Sale {String(sale.id).slice(-6).toUpperCase()}</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body">
          <form onSubmit={handleSubmit}>
            <div className="about-table-wrapper">
              <table className="about-roles-table">
                <thead><tr><th>Item</th><th>Sold</th><th>Already Returned</th><th>Return Qty</th><th>Refund</th></tr></thead>
                <tbody>
                  {sale.items.map((it, i) => (
                    <tr key={it.sku || i}>
                      <td>{it.name}</td>
                      <td>{it.qty}</td>
                      <td>{already[i]}</td>
                      <td><input type="number" min="0" max={remaining(i)} value={qtys[i]} onChange={(e) => setQty(i, e.target.value)} style={{ width: '80px' }} /></td>
                      <td>{money(qtys[i] * it.price)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="stock-onhand-hint" style={{ marginTop: '16px' }}>Total Refund: <strong>{money(totalRefund)}</strong></p>
            <div className="form-actions">
              <button type="submit" className="btn btn-danger" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Processing...</> : <><i className="fas fa-rotate-left"></i> Process Return</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// --- Sales History (view past sales, reprint receipts, process returns) ---
function SalesHistoryView({ user, role }) {
  const [reloadKey, setReloadKey] = useState(0);
  const [returnSaleId, setReturnSaleId] = useState(null);
  const [viewSale, setViewSale] = useState(null);
  const tableInstanceRef = useRef(null);

  const { loading, data, err } = useFetch(() => Promise.all([fbGetSales(), fbGetReturns()]), [reloadKey]);
  const sales = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const returns = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const reload = () => setReloadKey(k => k + 1);
  const byId = useMemo(() => sales.reduce((m, s) => (m[s.id] = s, m), {}), [sales]);

  const tableData = useMemo(() => sales.map(s => {
    const itemCount = (s.items || []).reduce((n, it) => n + it.qty, 0);
    const cogs = (s.items || []).reduce((c, it) => c + (Number(it.cost) || 0) * it.qty, 0);
    const profit = round2(Number(s.subtotal != null ? s.subtotal : s.total || 0) - Number(s.discount || 0) - cogs);
    const returnedTotal = returns.filter(r => r.saleId === s.id).reduce((sum, r) => sum + Number(r.totalRefund || 0), 0);
    return Object.assign({}, s, { itemCount, profit, returnedTotal });
  }), [sales, returns]);

  const summary = useMemo(() => ({
    count: sales.length,
    total: tableData.reduce((s, r) => s + Number(r.total || 0), 0),
    profit: tableData.reduce((s, r) => s + Number(r.profit || 0), 0),
    returned: tableData.reduce((s, r) => s + Number(r.returnedTotal || 0), 0)
  }), [tableData, sales.length]);

  useEffect(() => {
    if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load sales' });
  }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableInstanceRef.current;
    if (table) {
      table.clear().rows.add(tableData).draw(false);
    } else {
      table = $('#salesTable').DataTable({
        data: tableData,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        createdRow: (row, d) => { if (d.status === 'credit') $(row).addClass('row-danger'); else if (Number(d.returnedTotal) > 0) $(row).addClass('row-warn'); }, // credit=red, has-return=amber
        columns: [
          { data: 'invoiceNo', title: 'Invoice', render: (d, t, row) => t === 'display' ? '<code>' + esc(d || String(row.id).slice(-6).toUpperCase()) + '</code>' : (d || row.id) },
          { data: 'createdAt', title: 'Date', render: (d, t) => t === 'display' ? formatDateForDisplay(d) : d },
          { data: 'customerName', title: 'Customer', render: (d, t) => t === 'display' ? esc(d || 'Walk-in') : d },
          { data: 'cashier', title: 'Cashier', render: (d, t) => t === 'display' ? esc(d || '') : d },
          { data: 'itemCount', title: 'Items' },
          { data: 'total', title: 'Total', render: (d, t) => t === 'display' ? money(d) : d },
          { data: 'paymentMethod', title: 'Payment', render: (d, t) => t === 'display' ? (d ? '<span class="type-chip">' + esc(d) + '</span>' : '-') : (d || '') },
          { data: 'profit', title: 'Profit', render: (d, t) => t === 'display' ? `<span style="color:${Number(d) >= 0 ? '#155724' : '#721c24'};font-weight:600">${money(d)}</span>` : d },
          { data: 'returnedTotal', title: 'Returned', render: (d, t) => t === 'display' ? (d > 0 ? '<span class="status-badge status-inactive">' + money(d) + '</span>' : '-') : d },
          { data: null, title: 'Actions', orderable: false, render: (d, t, row) => `<button class="action-icon edit-icon" data-id="${row.id}" data-action="view"><i class="fas fa-receipt"></i></button>` + (role === 'Admin' ? `<button class="action-icon qr-icon" data-id="${row.id}" data-action="return"><i class="fas fa-rotate-left"></i></button>` : '') }
        ],
        pageLength: 10,
        lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
        responsive: true,
        dom: 'Blfrtip',
        buttons: [
          { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
          { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
          { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
        ],
        order: [[1, 'desc']]
      });
      tableInstanceRef.current = table;
    }
    $('#salesTable').off('click', '.action-icon').on('click', '.action-icon', function () {
      const id = $(this).data('id'); // read straight off the button - avoids DataTables Responsive collapsing rows into a child <tr> on mobile, which broke table.row(tr).data()
      const action = $(this).data('action');
      if (action === 'view') setViewSale(byId[id]);
      else if (action === 'return') setReturnSaleId(id);
    });
  }, [loading, tableData, role]);

  useEffect(() => () => {
    if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} }
  }, []);

  return (
    <div className="data-section">
      <div className="section-header"><h2><i className="fas fa-receipt"></i> Sales History</h2><div className="header-actions"><RefreshBtn onClick={reload} /></div></div>
      {loading && <TableSkeleton rows={8} columns={10} />}
      <div style={{ display: loading ? 'none' : 'block' }}>
        <table id="salesTable" className="display" style={{ width: '100%' }}></table>
        {sales.length > 0 && <SummaryBar items={[{ label: 'Sales', value: summary.count }, { label: 'Total', value: money(summary.total) }, { label: 'Profit', value: money(summary.profit) }, { label: 'Returned', value: money(summary.returned) }]} />}
      </div>
      {viewSale && <ThermalReceiptOverlay sale={viewSale} onClose={() => setViewSale(null)} />}
      {returnSaleId && <ReturnModal sale={byId[returnSaleId]} returns={returns} user={user} onClose={() => setReturnSaleId(null)} onDone={() => { setReturnSaleId(null); reload(); }} />}
    </div>
  );
}

// --- Dashboard View (Admin only) - POS overview ---
function DashboardView({ user, role, setActiveMenu }) {
  const { loading, data } = useFetch(() => Promise.all([fbGetSales(), fbGetProducts(), fbGetStockMovements(), fbGetExpenses()]), []);
  const sales = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const products = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const movements = useMemo(() => (data && data[2] && data[2].success ? data[2].data : []), [data]);
  const expenses = useMemo(() => (data && data[3] && data[3].success ? data[3].data : []), [data]);

  const barRef = useRef(null), payRef = useRef(null);
  const barChart = useRef(null), payChart = useRef(null);
  const ymd = (d) => { try { return jakartaDateStr(d); } catch (e) { return ''; } };
  const today = jakartaDateStr(new Date());

  const s = useMemo(() => {
    const todaySales = sales.filter(x => ymd(x.createdAt) === today);
    const lowStock = products.filter(p => computeQtyOnHand(p.id, movements) <= Number(p.reorderLevel || 0));
    const month = today.slice(0, 7);
    const monthRevenue = sales.filter(x => ymd(x.createdAt).slice(0, 7) === month).reduce((a, x) => a + Number(x.total || 0), 0);
    const monthExpenses = expenses.filter(e => (e.date || ymd(e.createdAt)).slice(0, 7) === month).reduce((a, e) => a + Number(e.amount || 0), 0);
    return {
      todayRevenue: todaySales.reduce((a, x) => a + Number(x.total || 0), 0),
      todayOrders: todaySales.length,
      lowStock,
      creditOutstanding: sales.filter(x => x.status === 'credit').reduce((a, x) => a + Number(x.total || 0), 0),
      stockValue: products.reduce((a, p) => a + computeQtyOnHand(p.id, movements) * (Number(p.cost) || 0), 0),
      monthRevenue, monthExpenses
    };
  }, [sales, products, movements, expenses, today]);

  const recentSales = useMemo(() => [...sales].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 6), [sales]);

  useEffect(() => {
    if (loading) return;
    const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
    const labels = days.map(d => d.toLocaleDateString('id-ID', { weekday: 'short', timeZone: 'Asia/Jakarta' }));
    const revByDay = days.map(d => { const k = jakartaDateStr(d); return sales.filter(x => ymd(x.createdAt) === k).reduce((a, x) => a + Number(x.total || 0), 0); });
    const byPay = sales.reduce((m, x) => { const k = x.paymentMethod || 'Other'; m[k] = (m[k] || 0) + Number(x.total || 0); return m; }, {});

    if (barChart.current) barChart.current.destroy();
    if (barRef.current) barChart.current = new Chart(barRef.current, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Revenue', data: revByDay, backgroundColor: 'rgba(0,116,217,0.7)', borderColor: '#0074D9', borderWidth: 2, borderRadius: 6, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });
    if (payChart.current) payChart.current.destroy();
    if (payRef.current) payChart.current = new Chart(payRef.current, {
      type: 'doughnut',
      data: { labels: Object.keys(byPay), datasets: [{ data: Object.values(byPay), backgroundColor: ['#001f3f','#0074D9','#34a853','#fbbc04','#ea4335','#8e44ad'], borderColor: '#fff', borderWidth: 2 }] },

// --- Suppliers View (vendor directory) ---
function SuppliersView({ user, role }) {
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [load, setLoad] = useState('');
  const tableRef = useRef(null);
  const { loading, data, err } = useFetch(() => fbGetSuppliers(), [reloadKey]);
  const suppliers = useMemo(() => (data && data.success ? data.data : []), [data]);
  const byId = useMemo(() => suppliers.reduce((m, s) => (m[s.id] = s, m), {}), [suppliers]);
  const reload = () => setReloadKey(k => k + 1);
  const totalPayable = useMemo(() => suppliers.reduce((s, x) => s + Number(x.openingBalance || 0), 0), [suppliers]);
  const [viewSup, setViewSup] = useState(null);

  useEffect(() => { if (err || (data && !data.success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data.message) || 'Failed to load suppliers' }); }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableRef.current;
    if (table) { table.clear().rows.add(suppliers).draw(false); }
    else {
      table = $('#suppliersTable').DataTable({
        data: suppliers,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        createdRow: (row, d) => { if (Number(d.openingBalance) > 0) $(row).addClass('row-warn'); }, // outstanding payable
        columns: [
          { data: 'name', title: 'Name', render: (d, t) => t === 'display' ? esc(d) : d },
          { data: 'contact', title: 'Contact', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'phone', title: 'Phone', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'email', title: 'Email', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'terms', title: 'Terms', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'openingBalance', title: 'Payable', render: (d, t) => t === 'display' ? money(d) : d },
          { data: null, title: 'Actions', orderable: false, render: (d, t, row) => `<button class="action-icon" data-id="${row.id}" data-action="view" title="View"><i class="fas fa-eye"></i></button><button class="action-icon edit-icon" data-id="${row.id}" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>` + (role === 'Admin' ? `<button class="action-icon delete-icon" data-id="${row.id}" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>` : '') }
        ],
        pageLength: 10, lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']], responsive: true, dom: 'Blfrtip',
        buttons: [{ extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } }, { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } }, { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }],
        order: [[0, 'asc']]
      });
      tableRef.current = table;
    }
    $('#suppliersTable').off('click', '.action-icon').on('click', '.action-icon', function () {
      const id = $(this).data('id'); // read straight off the button - avoids DataTables Responsive collapsing rows into a child <tr> on mobile, which broke table.row(tr).data()
      const act = $(this).data('action');
      if (act === 'view') setViewSup(byId[id]);
      else if (act === 'edit') { setEditingId(id); setShowModal(true); }
      else handleDelete(byId[id]);
    });
  }, [loading, suppliers, role]);

  useEffect(() => () => { if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) {} } }, []);

  const handleSave = async (fd) => {
    setLoad(editingId ? 'Updating supplier...' : 'Saving supplier...');
    const r = editingId ? await fbUpdateSupplier(editingId, fd, user) : await fbAddSupplier(fd, user);
    setLoad('');
    if (r.success) { setShowModal(false); setEditingId(null); Swal.fire({ icon: 'success', title: 'Success!', text: r.message, timer: 1800, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };
  const handleDelete = (s) => Swal.fire({ icon: 'warning', title: 'Delete supplier?', text: s.name, showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (res) => {
    if (!res.isConfirmed) return; setLoad('Deleting...'); const r = await fbDeleteSupplier(s.id, s.name, user); setLoad('');
    if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1600, showConfirmButton: false }); reload(); } else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  });

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header"><h2><i className="fas fa-truck-field"></i> Suppliers</h2><div className="header-actions"><RefreshBtn onClick={reload} /><button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> <span className="btn-label">Add Supplier</span></button></div></div>
      {loading && <TableSkeleton rows={8} columns={7} />}
      <div style={{ display: loading ? 'none' : 'block' }}><table id="suppliersTable" className="display" style={{ width: '100%' }}></table>{suppliers.length > 0 && <SummaryBar items={[{ label: 'Suppliers', value: suppliers.length }, { label: 'Total Payable', value: money(totalPayable) }]} />}</div>
      {viewSup && <SupplierHubModal supplier={viewSup} onClose={() => setViewSup(null)} />}
      {showModal && <SupplierModal editItem={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
    </div>
  );
}

// --- Expenses View ---
function ExpensesView({ user, role }) {
  const { settings } = useConfig();
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [load, setLoad] = useState('');
  const [filters, setFilters] = useState({ dateFrom: '', dateTo: '', category: '' });
  const tableRef = useRef(null);
  const { loading, data, err } = useFetch(() => fbGetExpenses(), [reloadKey]);
  const expenses = useMemo(() => (data && data.success ? data.data : []), [data]);
  const byId = useMemo(() => expenses.reduce((m, e) => (m[e.id] = e, m), {}), [expenses]);
  const reload = () => setReloadKey(k => k + 1);

  const filtered = useMemo(() => expenses.filter(e => {
    const d = new Date(e.date || e.createdAt);
    if (filters.dateFrom && d < new Date(filters.dateFrom)) return false;
    if (filters.dateTo && d > new Date(filters.dateTo + 'T23:59:59')) return false;
    if (filters.category && e.category !== filters.category) return false;
    return true;
  }), [expenses, filters]);
  const total = useMemo(() => filtered.reduce((s, e) => s + Number(e.amount || 0), 0), [filtered]);

  useEffect(() => { if (err || (data && !data.success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data.message) || 'Failed to load expenses' }); }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableRef.current;
    if (table) { table.clear().rows.add(filtered).draw(false); }
    else {
      table = $('#expensesTable').DataTable({
        data: filtered,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        columns: [
          { data: 'date', title: 'Date', render: (d, t, row) => t === 'display' ? esc(d || (row.createdAt || '').slice(0, 10)) : d },
          { data: 'category', title: 'Category', render: (d, t) => t === 'display' ? '<span class="type-chip">' + esc(d || '') + '</span>' : d },
          { data: 'payee', title: 'Payee', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'amount', title: 'Amount', render: (d, t) => t === 'display' ? money(d) : d },
          { data: 'paymentMethod', title: 'Paid Via', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'notes', title: 'Notes', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: null, title: 'Actions', orderable: false, render: (d, t, row) => (can('expenses_add', role, settings?.rolePermissions) ? `<button class="action-icon edit-icon" data-id="${row.id}" data-action="edit"><i class="fas fa-edit"></i></button>` : '') + (role === 'Admin' ? `<button class="action-icon delete-icon" data-id="${row.id}" data-action="delete"><i class="fas fa-trash"></i></button>` : '') }
        ],
        pageLength: 10, lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']], responsive: true, dom: 'Blfrtip',
        buttons: [{ extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } }, { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } }, { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }],
        order: [[0, 'desc']]
      });
      tableRef.current = table;
    }
    $('#expensesTable').off('click', '.action-icon').on('click', '.action-icon', function () {
      const id = $(this).data('id'); // read straight off the button - avoids DataTables Responsive collapsing rows into a child <tr> on mobile, which broke table.row(tr).data()
      $(this).data('action') === 'edit' ? (setEditingId(id), setShowModal(true)) : handleDelete(byId[id]);
    });
  }, [loading, filtered, role]);

  useEffect(() => () => { if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) {} } }, []);

  const handleSave = async (fd) => {
    setLoad(editingId ? 'Updating expense...' : 'Saving expense...');
    const r = editingId ? await fbUpdateExpense(editingId, fd, user) : await fbAddExpense(fd, user);
    setLoad('');
    if (r.success) { setShowModal(false); setEditingId(null); Swal.fire({ icon: 'success', title: 'Success!', text: r.message, timer: 1600, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };
  const handleDelete = (ex) => Swal.fire({ icon: 'warning', title: 'Delete expense?', text: (ex.category || '') + ' ' + money(ex.amount), showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (res) => {
    if (!res.isConfirmed) return; setLoad('Deleting...'); const r = await fbDeleteExpense(ex.id, (ex.category || 'Expense') + ' ' + money(ex.amount), user); setLoad('');
    if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); reload(); } else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  });

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header"><h2><i className="fas fa-money-bill-trend-up"></i> Expenses</h2><div className="header-actions"><RefreshBtn onClick={reload} />{can('expenses_add', role, settings?.rolePermissions) && <button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> <span className="btn-label">Add Expense</span></button>}</div></div>
      {!loading && (
        <FiltersPanel onClear={() => setFilters({ dateFrom: '', dateTo: '', category: '' })}>
          <div className="filter-group"><label><i className="fas fa-calendar-alt"></i> Date From</label><input type="date" className="filter-input" value={filters.dateFrom} onChange={(e) => setFilters(f => ({ ...f, dateFrom: e.target.value }))} /></div>
          <div className="filter-group"><label><i className="fas fa-calendar-alt"></i> Date To</label><input type="date" className="filter-input" value={filters.dateTo} onChange={(e) => setFilters(f => ({ ...f, dateTo: e.target.value }))} /></div>

        </FiltersPanel>
      )}
      {loading && <TableSkeleton rows={8} columns={7} />}
      <div style={{ display: loading ? 'none' : 'block' }}><table id="expensesTable" className="display" style={{ width: '100%' }}></table>{filtered.length > 0 && <SummaryBar items={[{ label: 'Entries', value: filtered.length }, { label: 'Total Expenses', value: money(total) }]} />}</div>
      {showModal && <ExpenseModal editItem={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
    </div>
  );
}

function PurchaseOrderModal({ suppliers, products, role, onClose, onSave }) {
  const { settings } = useConfig();
  const isAdmin = can('po_order', role, settings?.rolePermissions);
  const [supplierId, setSupplierId] = useState('');
  const [expectedDate, setExpectedDate] = useState('');
  const [notes, setNotes] = useState('');
  const [lines, setLines] = useState([]);
  const [productId, setProductId] = useState('');
  const [qty, setQty] = useState('');
  const [unitCost, setUnitCost] = useState('');
  const [saving, setSaving] = useState(false);

  const supplierOpts = useMemo(() => (suppliers || []).map(s => ({ value: s.id, label: s.name })), [suppliers]);
  const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
  const byId = useMemo(() => (products || []).reduce((m, p) => (m[p.id] = p, m), {}), [products]);
  const total = useMemo(() => lines.reduce((s, l) => s + l.qty * l.unitCost, 0), [lines]);

  const addLine = () => {
    const q = Number(qty), c = Number(unitCost);
    if (!productId) return Swal.fire({ icon: 'warning', title: 'Pick a product' });
    if (!Number.isInteger(q) || q < 1) return Swal.fire({ icon: 'warning', title: 'Invalid quantity' });
    const p = byId[productId];
    setLines(prev => {
      const ex = prev.find(l => l.productId === productId);
      if (ex) return prev.map(l => l.productId === productId ? { ...l, qty: l.qty + q, unitCost: c || l.unitCost } : l);
      return [...prev, { productId, name: p.name, sku: p.sku, qty: q, unitCost: c || Number(p.cost) || 0 }];
    });
    setProductId(''); setQty(''); setUnitCost('');
  };
  const removeLine = (id) => setLines(prev => prev.filter(l => l.productId !== id));

  const submit = async (status) => {
    if (!supplierId) return Swal.fire({ icon: 'warning', title: 'Pick a supplier' });
    if (!lines.length) return Swal.fire({ icon: 'warning', title: 'Add at least one line' });
    const finalStatus = isAdmin ? status : 'draft';
    const sup = (suppliers || []).find(s => s.id === supplierId);
    setSaving(true);
    await onSave({ supplierId, supplierName: sup ? sup.name : '', items: lines.map(l => ({ ...l, lineTotal: round2(l.qty * l.unitCost) })), total: round2(total), notes: notes.trim() || null, expectedDate: expectedDate || null, status: finalStatus });
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fas fa-file-invoice-dollar"></i> New Purchase Order</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
        <div className="modal-body">
          <div className="form-grid">
            <SearchableDropdown label="Supplier" icon="fas fa-truck-field" options={supplierOpts} value={supplierId} onChange={setSupplierId} placeholder="Select supplier..." required={true} />
            <div className="form-group"><label><i className="fas fa-calendar-day"></i> Expected Date</label><input type="date" value={expectedDate} onChange={(e) => setExpectedDate(e.target.value)} /></div>
          </div>
          <div className="pos-disc-row" style={{ gridTemplateColumns: '2fr 1fr 1fr auto', alignItems: 'end' }}>
            <SearchableDropdown label="Product" icon="fas fa-box" options={productOpts} value={productId} onChange={setProductId} placeholder="Add product..." />
            <div className="form-group"><label>Qty</label><input type="number" min="1" step="1" value={qty} onChange={(e) => setQty(e.target.value)} /></div>
            <div className="form-group"><label>Unit Cost</label><input type="number" min="0" step="0.01" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} /></div>
            <div className="form-group"><label>&nbsp;</label><button type="button" className="btn btn-secondary" onClick={addLine}><i className="fas fa-plus"></i> Add</button></div>
          </div>
          {lines.length > 0 && (
            <div className="about-table-wrapper" style={{ marginTop: 12 }}>
              <table className="about-roles-table">
                <thead><tr><th>Item</th><th>Qty</th><th>Unit Cost</th><th>Line Total</th><th></th></tr></thead>
                <tbody>
                  {lines.map(l => (
                    <tr key={l.productId}>
                      <td>{l.name}<div className="cell-sub">{l.sku}</div></td><td>{l.qty}</td><td>{money(l.unitCost)}</td><td>{money(l.qty * l.unitCost)}</td>
                      <td><button className="action-icon delete-icon" onClick={() => removeLine(l.productId)}><i className="fas fa-times"></i></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <p className="stock-onhand-hint" style={{ marginTop: 12 }}>PO Total: <strong>{money(total)}</strong></p>
          {!isAdmin && <p className="stock-onhand-hint" style={{ color: '#a15c00' }}><i className="fas fa-circle-info"></i> Saved as a draft for supervisor/manager review — actual order quantities depend on real-time supplier stock.</p>}
          <div className="form-group"><label>Notes</label><textarea rows="2" value={notes} onChange={(e) => setNotes(e.target.value)}></textarea></div>
          <div className="form-actions">
            {isAdmin && <button type="button" className="btn btn-primary" disabled={saving} onClick={() => submit('ordered')}><i className="fas fa-paper-plane"></i> Save &amp; Order</button>}
            <button type="button" className="btn btn-secondary" disabled={saving} onClick={() => submit('draft')}><i className="fas fa-floppy-disk"></i> Save Draft</button>
            <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- PO detail + receive ---
function PoDetailModal({ po, role, onClose, onReceive }) {
  const { settings } = useConfig();
  if (!po) return null;
  const receivable = can('po_receive', role, settings?.rolePermissions) && po.status !== 'received' && po.status !== 'cancelled';
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fas fa-file-invoice-dollar"></i> {po.poNumber}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
        <div className="modal-body">
          <div className="ts-meta" style={{ marginBottom: 12 }}>
            <div className="ts-meta-row"><span>Supplier:</span><span>{po.supplierName || '-'}</span></div>
            <div className="ts-meta-row"><span>Status:</span><span>{po.status}</span></div>
            <div className="ts-meta-row"><span>Expected:</span><span>{po.expectedDate || '-'}</span></div>
            <div className="ts-meta-row"><span>Created:</span><span>{formatDateForDisplay(po.createdAt)}</span></div>
          </div>
          <div className="about-table-wrapper">
            <table className="about-roles-table">
              <thead><tr><th>Item</th><th>Qty</th><th>Unit Cost</th><th>Line Total</th></tr></thead>
              <tbody>{(po.items || []).map((it, i) => <tr key={it.sku || i}><td>{it.name}<div className="cell-sub">{it.sku}</div></td><td>{it.qty}</td><td>{money(it.unitCost)}</td><td>{money(it.lineTotal != null ? it.lineTotal : it.qty * it.unitCost)}</td></tr>)}</tbody>
            </table>
          </div>
          <p className="stock-onhand-hint" style={{ marginTop: 12 }}>PO Total: <strong>{money(po.total)}</strong></p>
          {po.notes ? <p style={{ color: '#666', marginTop: 8 }}>{po.notes}</p> : null}
          <div className="form-actions">
            {receivable && <button className="btn btn-success" onClick={() => onReceive(po)}><i className="fas fa-dolly"></i> Receive into Stock</button>}
            <button className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Close</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- Purchase Orders View ---
function PurchaseOrdersView({ user, role }) {
  const { settings } = useConfig();
  const [showModal, setShowModal] = useState(false);
  const [viewPo, setViewPo] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [load, setLoad] = useState('');
  const tableRef = useRef(null);
  const { loading, data, err } = useFetch(() => Promise.all([fbGetPurchaseOrders(), fbGetSuppliers(), fbGetProducts()]), [reloadKey]);
  const pos = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const suppliers = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const products = useMemo(() => (data && data[2] && data[2].success ? data[2].data : []), [data]);
  const byId = useMemo(() => pos.reduce((m, p) => (m[p.id] = p, m), {}), [pos]);
  const tableData = useMemo(() => pos.map(p => Object.assign({}, p, { itemCount: (p.items || []).length })), [pos]);
  const reload = () => setReloadKey(k => k + 1);
  const poSummary = useMemo(() => ({
    count: pos.length,
    total: pos.reduce((s, p) => s + Number(p.total || 0), 0),
    open: pos.filter(p => p.status !== 'received' && p.status !== 'cancelled').reduce((s, p) => s + Number(p.total || 0), 0)
  }), [pos]);

  const statusBadge = (s) => {
    const map = { received: 'status-active', ordered: 'type-chip', draft: '', cancelled: 'status-inactive' };
    const cls = map[s] || 'type-chip';
    return `<span class="${cls === 'type-chip' ? 'type-chip' : 'status-badge ' + cls}">${esc(s || 'draft')}</span>`;
  };

  useEffect(() => { if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load POs' }); }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableRef.current;
    if (table) { table.clear().rows.add(tableData).draw(false); }
    else {
      table = $('#poTable').DataTable({
        data: tableData,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        createdRow: (row, d) => { if (d.status === 'received') $(row).addClass('row-ok'); else if (d.status === 'cancelled') $(row).addClass('row-muted'); else $(row).addClass('row-warn'); }, // received=green, cancelled=grey, open=amber
        columns: [
          { data: 'poNumber', title: 'PO #', render: (d, t) => t === 'display' ? '<code>' + esc(d || '') + '</code>' : d },
          { data: 'createdAt', title: 'Date', render: (d, t) => t === 'display' ? formatDateForDisplay(d) : d },
          { data: 'supplierName', title: 'Supplier', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'itemCount', title: 'Lines' },
          { data: 'total', title: 'Total', render: (d, t) => t === 'display' ? money(d) : d },
          { data: 'status', title: 'Status', render: (d, t) => t === 'display' ? statusBadge(d) : d },
          { data: 'expectedDate', title: 'Expected', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: null, title: 'Actions', orderable: false, render: (d, t, row) => `<button class="action-icon edit-icon" data-id="${row.id}" data-action="view"><i class="fas fa-eye"></i></button>` + (can('po_receive', role, settings?.rolePermissions) && row.status !== 'received' && row.status !== 'cancelled' ? `<button class="action-icon qr-icon" data-id="${row.id}" data-action="receive"><i class="fas fa-dolly"></i></button>` : '') + (role === 'Admin' ? `<button class="action-icon delete-icon" data-id="${row.id}" data-action="delete"><i class="fas fa-trash"></i></button>` : '') }
        ],
        pageLength: 10, lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']], responsive: true, dom: 'Blfrtip',
        buttons: [{ extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } }, { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } }, { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }],
        order: [[1, 'desc']]
      });
      tableRef.current = table;
    }
    $('#poTable').off('click', '.action-icon').on('click', '.action-icon', function () {
      const id = $(this).data('id'); // read straight off the button - avoids DataTables Responsive collapsing rows into a child <tr> on mobile, which broke table.row(tr).data()
      const action = $(this).data('action');
      if (action === 'view') setViewPo(byId[id]);
      else if (action === 'receive') doReceive(byId[id]);
      else handleDelete(byId[id]);
    });
  }, [loading, tableData, role]);

  useEffect(() => () => { if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) {} } }, []);

  const handleSave = async (po) => {
    setLoad('Creating PO...');
    const r = await fbCreatePurchaseOrder(po, user);
    setLoad('');
    if (r.success) { setShowModal(false); Swal.fire({ icon: 'success', title: 'Success!', text: r.message, timer: 1800, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };

  const doReceive = async (po) => {
    if (!po || !can('po_receive', role, settings?.rolePermissions)) return;
    const res = await Swal.fire({ icon: 'question', title: 'Receive PO?', text: `Post ${(po.items || []).length} line(s) as Stock In and mark ${po.poNumber} received?`, showCancelButton: true, confirmButtonText: 'Receive', input: 'checkbox', inputValue: 1, inputPlaceholder: 'Also update product costs' });
    if (!res.isConfirmed) return;
    setViewPo(null); setLoad('Receiving stock...');
    const r = await fbReceivePurchaseOrder(po, user, !!res.value);
    setLoad('');
    if (r.success) { Swal.fire({ icon: 'success', title: 'Received', text: r.message, timer: 1800, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };

  const handleDelete = (po) => Swal.fire({ icon: 'warning', title: 'Delete PO?', text: po.poNumber, showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (res) => {
    if (!res.isConfirmed) return; setLoad('Deleting...'); const r = await fbDeletePurchaseOrder(po.id, po.poNumber, user); setLoad('');
    if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); reload(); } else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  });

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header"><h2><i className="fas fa-file-invoice-dollar"></i> Purchase Orders</h2><div className="header-actions"><RefreshBtn onClick={reload} /><button className="btn btn-success" disabled={loading} onClick={() => setShowModal(true)}><i className="fas fa-plus"></i> <span className="btn-label">New PO</span></button></div></div>
      {loading && <TableSkeleton rows={8} columns={8} />}
      <div style={{ display: loading ? 'none' : 'block' }}><table id="poTable" className="display" style={{ width: '100%' }}></table>{pos.length > 0 && <SummaryBar items={[{ label: 'POs', value: poSummary.count }, { label: 'Total Value', value: money(poSummary.total) }, { label: 'Open (unreceived)', value: money(poSummary.open) }]} />}</div>
      {showModal && <PurchaseOrderModal suppliers={suppliers} products={products} role={role} onClose={() => setShowModal(false)} onSave={handleSave} />}
      {viewPo && <PoDetailModal po={viewPo} role={role} onClose={() => setViewPo(null)} onReceive={doReceive} />}
    </div>
  );
}

// --- Recipe Modal (Add/Edit) - Admin only. Can pick an existing product to produce, or create a new one inline. ---
function RecipeModal({ editItem, products, role, onClose, onSave }) {
  const [producesMode, setProducesMode] = useState('existing'); // 'existing' | 'new'
  const [producesProductId, setProducesProductId] = useState(editItem?.producesProductId || '');
  const [newProductName, setNewProductName] = useState('');
  const [name, setName] = useState(editItem?.name || '');
  const [batchYieldQty, setBatchYieldQty] = useState(editItem?.batchYieldQty ?? '');
  const [batchYieldUnit, setBatchYieldUnit] = useState(editItem?.batchYieldUnit || '');
  const [portions, setPortions] = useState(editItem?.portionsPerBatch ?? 1);
  const [notes, setNotes] = useState(editItem?.notes || '');
  const [items, setItems] = useState(editItem?.items || []);
  const [itemProductId, setItemProductId] = useState('');
  const [itemQty, setItemQty] = useState('');
  const [saving, setSaving] = useState(false);

  const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
  const byId = useMemo(() => (products || []).reduce((m, p) => (m[p.id] = p, m), {}), [products]);

  const addItem = () => {
    if (!itemProductId) return Swal.fire({ icon: 'warning', title: 'Pick an item' });
    const q = Number(itemQty);
    if (!(q > 0)) return Swal.fire({ icon: 'warning', title: 'Invalid quantity' });
    const p = byId[itemProductId];
    if (!p) return;
    setItems(prev => {
      const ex = prev.find(l => l.productId === itemProductId);
      if (ex) return prev.map(l => l.productId === itemProductId ? { ...l, qty: l.qty + q } : l);
      return [...prev, { productId: itemProductId, name: p.name, sku: p.sku, unit: p.unit || '', qty: q }];
    });
    setItemProductId(''); setItemQty('');
  };
  const removeItem = (id) => setItems(prev => prev.filter(l => l.productId !== id));

  const submit = async () => {
    if (producesMode === 'existing' && !producesProductId) return Swal.fire({ icon: 'warning', title: 'Pick what this recipe produces' });
    if (producesMode === 'new' && !newProductName.trim()) return Swal.fire({ icon: 'warning', title: 'Enter a name for the new product' });
    if (!name.trim()) return Swal.fire({ icon: 'warning', title: 'Enter a recipe name' });
    if (!(Number(batchYieldQty) > 0)) return Swal.fire({ icon: 'warning', title: 'Enter a valid batch yield' });
    if (!batchYieldUnit) return Swal.fire({ icon: 'warning', title: 'Pick a batch yield unit' });
    if (!items.length) return Swal.fire({ icon: 'warning', title: 'Add at least one ingredient' });
    setSaving(true);
    await onSave({
      name: name.trim(), batchYieldQty: Number(batchYieldQty), batchYieldUnit, portionsPerBatch: Number(portions) || 1,
      notes: notes.trim() || null, items,
      producesProductId, // existing-product case; RecipesView creates the new product first when producesMode is 'new'
      _newProduct: producesMode === 'new' ? { name: newProductName.trim(), unit: batchYieldUnit } : null
    });
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fas fa-book-open"></i> {editItem ? 'Edit Recipe' : 'New Recipe'}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
        <div className="modal-body">
          <div className="form-grid">
            <div className="form-group">
              <label><i className="fas fa-utensils"></i> Produces *</label>
              {producesMode === 'existing'
                ? <SearchableDropdown options={productOpts} value={producesProductId} onChange={setProducesProductId} placeholder="Finished item..." required={true} />
                : <input type="text" placeholder="New product name..." value={newProductName} onChange={(e) => setNewProductName(e.target.value)} />}
              {!editItem && <button type="button" className="btn-link-sm" onClick={() => setProducesMode(m => m === 'existing' ? 'new' : 'existing')}>{producesMode === 'existing' ? '+ Create a new product instead' : '\u2190 Use an existing product'}</button>}
            </div>
            <div className="form-group"><label>Recipe Name</label><input type="text" placeholder="Cilantro Rice 10 KG" value={name} onChange={(e) => setName(e.target.value)} /></div>
          </div>
          <div className="form-grid">
            <div className="form-group">
              <label>Batch Yield *</label>
              <div className="pos-disc-row" style={{ gridTemplateColumns: '1fr 1fr' }}>
                <input type="number" min="0" step="0.01" value={batchYieldQty} onChange={(e) => setBatchYieldQty(e.target.value)} />
                <SearchableDropdown options={BATCH_UNIT_OPTS} value={batchYieldUnit} onChange={setBatchYieldUnit} placeholder="Select..." required={true} />
              </div>
            </div>
            <div className="form-group"><label>Portions per batch</label><input type="number" min="1" step="1" value={portions} onChange={(e) => setPortions(e.target.value)} /></div>
          </div>
          <div className="form-group"><label>Notes</label><textarea rows="2" placeholder="method, holding time..." value={notes} onChange={(e) => setNotes(e.target.value)}></textarea></div>

          <div className="pos-disc-row" style={{ gridTemplateColumns: '2fr 1fr auto', alignItems: 'end', marginTop: 12 }}>
            <SearchableDropdown label="Add Item" icon="fas fa-plus" options={productOpts} value={itemProductId} onChange={setItemProductId} placeholder="Search & add item..." />
            <div className="form-group"><label>Qty</label><input type="number" min="0" step="0.01" value={itemQty} onChange={(e) => setItemQty(e.target.value)} /></div>
            <div className="form-group"><label>&nbsp;</label><button type="button" className="btn btn-secondary" onClick={addItem}><i className="fas fa-plus"></i> Add</button></div>
          </div>
          {items.length > 0 && (
            <div className="about-table-wrapper" style={{ marginTop: 12 }}>
              <table className="about-roles-table">
                <thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th></th></tr></thead>
                <tbody>
                  {items.map(l => (
                    <tr key={l.productId}>
                      <td>{l.name}<div className="cell-sub">{l.sku}</div></td><td>{l.qty}</td><td>{l.unit || '-'}</td>
                      <td><button className="action-icon delete-icon" onClick={() => removeItem(l.productId)}><i className="fas fa-times"></i></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div className="form-actions">
            <button type="button" className="btn btn-primary" disabled={saving} onClick={submit}><i className="fas fa-save"></i> Save Recipe</button>
            <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- Recipe Detail + Produce Batch (Admin + User can produce; view-only ingredient list) ---
function RecipeDetailModal({ recipe, movements, onClose, onProduce }) {
  const [batches, setBatches] = useState(1);
  const [producing, setProducing] = useState(false);
  if (!recipe) return null;
  const n = Number(batches) || 0;
  const rows = (recipe.items || []).map(it => {
    const need = round2(it.qty * n);
    const have = computeQtyOnHand(it.productId, movements || []);
    return { ...it, need, have, short: have < need };
  });
  const anyShort = rows.some(r => r.short);

  const handleProduce = async () => {
    if (!(n > 0)) return Swal.fire({ icon: 'warning', title: 'Enter how many batches to produce' });
    setProducing(true);
    await onProduce(recipe, n);
    setProducing(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fas fa-book-open"></i> {recipe.name}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
        <div className="modal-body">
          <div className="ts-meta" style={{ marginBottom: 12 }}>
            <div className="ts-meta-row"><span>Produces:</span><span>{recipe.producesProductName}</span></div>
            <div className="ts-meta-row"><span>Batch Yield:</span><span>{recipe.batchYieldQty} {recipe.batchYieldUnit}</span></div>
            <div className="ts-meta-row"><span>Portions/batch:</span><span>{recipe.portionsPerBatch || 1}</span></div>
          </div>
          {recipe.notes && <p style={{ color: '#666', marginBottom: 12 }}>{recipe.notes}</p>}
          <div className="about-table-wrapper">
            <table className="about-roles-table">
              <thead><tr><th>Ingredient</th><th>Per Batch</th><th>Needed x{n || 0}</th><th>In Stock</th></tr></thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.productId} className={r.short ? 'row-warn' : ''}>
                    <td>{r.name}<div className="cell-sub">{r.sku}</div></td><td>{r.qty} {r.unit}</td><td>{r.need} {r.unit}</td>
                    <td>{r.short ? <span className="status-badge status-inactive">{r.have} {r.unit}</span> : `${r.have} ${r.unit}`}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="pos-disc-row" style={{ gridTemplateColumns: '1fr auto', alignItems: 'end', marginTop: 16 }}>
            <div className="form-group"><label>Batches to produce</label><input type="number" min="1" step="1" value={batches} onChange={(e) => setBatches(e.target.value)} /></div>
            <div className="form-group"><label>&nbsp;</label><button type="button" className="btn btn-success" disabled={producing || anyShort || !(n > 0)} onClick={handleProduce}><i className="fas fa-industry"></i> Produce Batch</button></div>
          </div>
          {anyShort && <p style={{ color: '#c0392b', marginTop: 8 }}><i className="fas fa-triangle-exclamation"></i> Not enough stock for one or more ingredients — reduce batches or restock first.</p>}
          <div className="form-actions"><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Close</button></div>
        </div>
      </div>
    </div>
  );
}

// --- Recipes View ---
function RecipesView({ user, role }) {
  const { settings } = useConfig();
  const isAdmin = role === 'Admin';
  const canManage = can('recipes_manage', role, settings?.rolePermissions);
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [viewRecipe, setViewRecipe] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [load, setLoad] = useState('');
  const tableRef = useRef(null);
  const { loading, data, err } = useFetch(() => Promise.all([fbGetRecipes(), fbGetProducts(), fbGetStockMovements()]), [reloadKey]);
  const recipes = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const products = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const movements = useMemo(() => (data && data[2] && data[2].success ? data[2].data : []), [data]);
  const byId = useMemo(() => recipes.reduce((m, r) => (m[r.id] = r, m), {}), [recipes]);
  const tableData = useMemo(() => recipes.map(r => Object.assign({}, r, { itemCount: (r.items || []).length })), [recipes]);
  const reload = () => setReloadKey(k => k + 1);

  useEffect(() => { if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load recipes' }); }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableRef.current;
    if (table) { table.clear().rows.add(tableData).draw(false); }
    else {
      table = $('#recipeTable').DataTable({
        data: tableData,
        columnDefs: [{ targets: '_all', defaultContent: '' }],
        columns: [
          { data: 'name', title: 'Recipe', render: (d, t) => t === 'display' ? esc(d || '') : d },
          { data: 'producesProductName', title: 'Produces', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'batchYieldQty', title: 'Batch Yield', render: (d, t, row) => t === 'display' ? `${d || 0} ${esc(row.batchYieldUnit || '')}` : d },
          { data: 'portionsPerBatch', title: 'Portions' },
          { data: 'itemCount', title: 'Ingredients' },
          { data: null, title: 'Actions', orderable: false, render: (d, t, row) => `<button class="action-icon edit-icon" data-id="${row.id}" data-action="view"><i class="fas fa-eye"></i></button>` + (canManage ? `<button class="action-icon edit-icon" data-id="${row.id}" data-action="edit"><i class="fas fa-pen"></i></button>` : '') + (isAdmin ? `<button class="action-icon delete-icon" data-id="${row.id}" data-action="delete"><i class="fas fa-trash"></i></button>` : '') }
        ],
        pageLength: 10, lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']], responsive: true, dom: 'Blfrtip',
        buttons: [{ extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } }, { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } }, { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }],
        order: [[0, 'asc']]
      });
      tableRef.current = table;
    }
    $('#recipeTable').off('click', '.action-icon').on('click', '.action-icon', function () {
      const id = $(this).data('id'); // read straight off the button - avoids DataTables Responsive collapsing rows into a child <tr> on mobile, which broke table.row(tr).data()
      const action = $(this).data('action');
      if (action === 'view') setViewRecipe(byId[id]);
      else if (action === 'edit') { setEditingId(id); setShowModal(true); }
      else handleDelete(byId[id]);
    });
  }, [loading, tableData, isAdmin, canManage]);

  useEffect(() => () => { if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) {} } }, []);

  const handleSave = async (recipe) => {
    setLoad(editingId ? 'Updating recipe...' : 'Creating recipe...');
    let producesProductId = recipe.producesProductId;
    let producesProductName = (products.find(p => p.id === producesProductId) || {}).name;
    if (recipe._newProduct) {
      const pr = await fbAddProduct({ name: recipe._newProduct.name, unit: recipe._newProduct.unit, category: 'Finished Goods', price: 0, cost: 0, reorderLevel: 0, status: 'active' }, user);
      if (!pr.success) { setLoad(''); return Swal.fire({ icon: 'error', title: 'Error', text: pr.message }); }
      producesProductId = pr.id; producesProductName = recipe._newProduct.name;
    }
    const payload = { name: recipe.name, batchYieldQty: recipe.batchYieldQty, batchYieldUnit: recipe.batchYieldUnit, portionsPerBatch: recipe.portionsPerBatch, notes: recipe.notes, items: recipe.items, producesProductId, producesProductName };
    const r = await fbSaveRecipe(editingId, payload, user);
    setLoad('');
    if (r.success) { setShowModal(false); setEditingId(null); Swal.fire({ icon: 'success', title: 'Success!', text: r.message, timer: 1800, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };

  const handleDelete = async (recipe) => {
    if (!recipe) return;
    const res = await Swal.fire({ icon: 'warning', title: 'Delete recipe?', text: recipe.name, showCancelButton: true, confirmButtonText: 'Delete' });
    if (!res.isConfirmed) return;
    const r = await fbDeleteRecipe(recipe.id, recipe.name, user);
    if (r.success) { Swal.fire({ icon: 'success', title: 'Deleted', timer: 1500, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };

  const handleProduce = async (recipe, batches) => {
    setLoad('Producing batch...');
    const r = await fbProduceBatch(recipe, batches, movements, user);
    setLoad('');
    if (r.success) { setViewRecipe(null); Swal.fire({ icon: 'success', title: 'Produced!', text: r.message, timer: 1800, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Cannot produce', text: r.message });
  };

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-book-open"></i> Recipes</h2>
        <div className="header-actions">
          <RefreshBtn onClick={reload} />
          {canManage && <button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> <span className="btn-label">New Recipe</span></button>}
        </div>
      </div>
      <table id="recipeTable" className="display" style={{ width: '100%' }}></table>
      {showModal && <RecipeModal editItem={editingId ? byId[editingId] : null} products={products} role={role} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
      {viewRecipe && <RecipeDetailModal recipe={viewRecipe} movements={movements} onClose={() => setViewRecipe(null)} onProduce={handleProduce} />}
    </div>
  );
}

// --- User Modal (Add/Edit) ---
function UserModal({ editUser, onClose, onSave }) {
  const [formData, setFormData] = useState({
    name: editUser?.name || '', email: editUser?.email || '', password: '', role: editUser?.role || 'User'
  });
  const [saving, setSaving] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setSaving(true);
    const payload = { name: formData.name, email: formData.email, role: formData.role };
    if (!editUser || formData.password) payload.password = formData.password;
    await onSave(payload);
    setSaving(false); // re-enable on failed save (parent keeps modal open)
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3><i className="fas fa-user-gear"></i> {editUser ? 'Edit' : 'Add'} User</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body">
          <form onSubmit={submit}>
            <div className="form-grid">
              <div className="form-group"><label>Name *</label><input type="text" value={formData.name} onChange={(e) => setFormData(p => ({ ...p, name: e.target.value }))} required /></div>
              <div className="form-group"><label>Email *</label><input type="email" value={formData.email} onChange={(e) => setFormData(p => ({ ...p, email: e.target.value }))} required /></div>
              <div className="form-group"><label>Password {editUser ? '(leave blank to keep current)' : '*'}</label><input type="password" value={formData.password} onChange={(e) => setFormData(p => ({ ...p, password: e.target.value }))} required={!editUser} /></div>
              <SearchableDropdown label="Role" icon="fas fa-user-shield" options={ROLE_OPTS} value={formData.role} onChange={(val) => setFormData(p => ({ ...p, role: val }))} placeholder="Select role..." required={true} />
            </div>
            <div className="form-actions">
              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// --- Users View (Admin only - manages the /users login collection) ---
function UsersView({ user, role }) {
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [load, setLoad] = useState('');
  const tableInstanceRef = useRef(null);

  const { loading, data, err } = useFetch(() => fbGetUsers(), [reloadKey]);
  const [viewUser, setViewUser] = useState(null);
  const users = useMemo(() => (data && data.success ? data.data : []), [data]);
  const reload = () => setReloadKey(k => k + 1);
  const byId = useMemo(() => users.reduce((m, u) => (m[u.id] = u, m), {}), [users]);
  const adminCount = useMemo(() => users.filter(u => u.role === 'Admin').length, [users]);
  const openEdit = useCallback((id) => { setEditingId(id); setShowModal(true); }, []);

  useEffect(() => {
    if (err || (data && !data.success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data.message) || 'Failed to load users' });
  }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableInstanceRef.current;
    if (table) {
      table.clear().rows.add(users).draw(false);
    } else {
      table = $('#usersTable').DataTable({
        data: users,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        columns: [
          { data: 'name', title: 'Name', render: (d, t) => t === 'display' ? esc(d) : d },
          { data: 'email', title: 'Email', render: (d, t) => t === 'display' ? esc(d) : d },
          { data: 'role', title: 'Role', render: (d, t) => t === 'display' ? '<span class="role-badge ' + (d === 'Admin' ? 'role-admin' : 'role-emp') + '">' + esc(d) + '</span>' : d },
          { data: null, title: 'Actions', orderable: false, render: (d, t, row) => `<button class="action-icon" data-id="${row.id}" data-action="view" title="View"><i class="fas fa-eye"></i></button><button class="action-icon edit-icon" data-id="${row.id}" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button><button class="action-icon delete-icon" data-id="${row.id}" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>` }
        ],
        pageLength: 10,
        lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
        responsive: true,
        dom: 'Blfrtip',
        buttons: [
          { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
          { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
          { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
        ],
        order: [[0, 'asc']]
      });
      tableInstanceRef.current = table;
    }
    $('#usersTable').off('click', '.action-icon').on('click', '.action-icon', function () {
      const id = $(this).data('id'); // read straight off the button - avoids DataTables Responsive collapsing rows into a child <tr> on mobile, which broke table.row(tr).data()
      const act = $(this).data('action');
      if (act === 'view') setViewUser(byId[id]);
      else if (act === 'edit') openEdit(id);
      else handleDelete(byId[id]);
    });
  }, [loading, users]);

  useEffect(() => () => {
    if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} }
  }, []);

  const handleSave = async (formData) => {
    setLoad(editingId ? 'Updating user...' : 'Saving user...');
    const result = editingId ? await fbUpdateUser(editingId, formData, user) : await fbAddUser(formData, user);
    setLoad('');
    if (result.success) {
      setShowModal(false); setEditingId(null);
      Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
      reload();
    } else {
      Swal.fire({ icon: 'error', title: 'Error', text: result.message });
    }
  };

  const handleDelete = (u) => {
    if (u.id === user.id || u.email === user.email) return Swal.fire({ icon: 'warning', title: 'Not Allowed', text: 'You cannot delete your own account while logged in.' });
    if (u.role === 'Admin' && adminCount <= 1) return Swal.fire({ icon: 'warning', title: 'Not Allowed', text: 'At least one Admin account must remain.' });
    Swal.fire({ icon: 'warning', title: 'Delete?', text: 'This cannot be undone', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (result) => {
      if (!result.isConfirmed) return;
      setLoad('Deleting user...');
      const r = await fbDeleteUser(u.id, u.name, user);
      setLoad('');
      if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 2000, showConfirmButton: false }); reload(); }
      else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
    });
  };

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-users-cog"></i> Users</h2>
        <div className="header-actions"><RefreshBtn onClick={reload} /><button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> <span className="btn-label">Add User</span></button></div>
      </div>
      {loading && <TableSkeleton rows={5} columns={4} />}
      <div style={{ display: loading ? 'none' : 'block' }}>
        <table id="usersTable" className="display" style={{ width: '100%' }}></table>
      </div>
      {viewUser && <UserHubModal account={viewUser} onClose={() => setViewUser(null)} />}
      {showModal && <UserModal editUser={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
    </div>
  );
}
