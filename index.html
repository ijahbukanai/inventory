              <tr><td>Manage Settings &amp; Categories</td><td><i className="fas fa-check-circle text-success"></i> Yes</td><td><i className="fas fa-times-circle text-danger"></i> No</td></tr>
              <tr><td>View Activity Logs</td><td><i className="fas fa-check-circle text-success"></i> Yes</td><td><i className="fas fa-times-circle text-danger"></i> No</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div className="about-card">
        <h2><i className="fas fa-calculator"></i> Formulas & Business Logic</h2>
        <p className="mb-24">All the calculations this app does behind the scenes — so theres no confusion later about how somthing gets computed.</p>
        <div className="about-table-wrapper">
          <table className="about-roles-table">
            <thead><tr><th>What</th><th>Formula / Logic</th><th>Where Used</th></tr></thead>
            <tbody>
              <tr><td>Total Records</td><td>Count of all records in the database</td><td>Dashboard KPI</td></tr>
              <tr><td>Active Records</td><td>Count where active = true</td><td>Dashboard KPI</td></tr>
              <tr><td>Inactive Records</td><td>Total Records − Active Records</td><td>Dashboard KPI</td></tr>
              <tr><td>Total Amount</td><td>Σ amount across all records</td><td>Dashboard KPI</td></tr>
              <tr><td>Records by Category</td><td>Group + count records per category</td><td>Dashboard Chart</td></tr>
              <tr><td>Monthly Trend</td><td>Group + count records by created month (last 6 months)</td><td>Dashboard Chart</td></tr>
              <tr><td>SKU Number</td><td>'SKU-' + zero-padded 5-digit sequence from /counters/products (atomic Firebase transaction, avoids duplicate SKUs under concurrent adds)</td><td>Add Product (auto, read-only after)</td></tr>
              <tr><td>Qty On Hand</td><td>Σ qty where type='in' − Σ qty where type='out', per product, from the Stock In/Out ledger — never a stored counter, always recomputed live</td><td>Products list, Stock ledger, POS cart guard</td></tr>
              <tr><td>Low Stock Flag</td><td>Qty On Hand &lt;= Reorder Level</td><td>Products list (red badge), Stock Status filter</td></tr>
              <tr><td>Stock Out Negative-Qty Check</td><td>Warns (does not block) if requested qty &gt; current Qty On Hand</td><td>Stock Out flow</td></tr>
              <tr><td>Running Balance</td><td>Per product, cumulative Σ (in − out) applied oldest→newest; each ledger row shows the on-hand right after it</td><td>Stock In/Out ledger</td></tr>
              <tr><td>Stocktake Adjustment</td><td>Counted Qty − System On Hand → posts a correcting Stock In (if +) or Stock Out (if −) with reason "Adjustment"</td><td>Stocktake</td></tr>
              <tr><td>Receiving Unit Cost</td><td>Optional on Stock In — records the landed unit cost and, if ticked, updates the product's cost to it</td><td>Stock In</td></tr>
              <tr><td>Sale Line Total</td><td>qty × price, per cart line</td><td>POS Cart, Thermal Receipt</td></tr>
              <tr><td>Order Discount</td><td>Percent → Subtotal × %; Amount → capped at Subtotal. Spread proportionally across lines so tax is charged on the discounted amount</td><td>POS Checkout</td></tr>
              <tr><td>Sale Tax</td><td>Per line: discounted line × effective tax rate (product rate, else Settings default). Tax-inclusive mode extracts tax out of the price instead of adding it</td><td>POS Checkout, Receipt</td></tr>
              <tr><td>Sale Grand Total</td><td>Tax-exclusive: Subtotal − Discount + Tax. Tax-inclusive: Subtotal − Discount (tax already inside)</td><td>POS Checkout, Thermal Receipt</td></tr>
              <tr><td>Change Due</td><td>max(0, Amount Tendered − Grand Total) — cash payments only</td><td>POS Checkout, Receipt</td></tr>
              <tr><td>Invoice Number</td><td>Settings prefix + zero-padded 5-digit sequence from /counters/sales (atomic transaction)</td><td>Every sale</td></tr>
              <tr><td>Gross Profit (per sale)</td><td>(Subtotal − Discount) − Σ (line cost × qty); cost is snapshotted onto each line at checkout so later cost edits don't distort history</td><td>Sales History "Profit" column</td></tr>
              <tr><td>Total Expenses</td><td>Σ expense amounts over the selected date range / category</td><td>Expenses (feeds Net Profit)</td></tr>
              <tr><td>Scan Resolve (fast)</td><td>Scanned/typed code matched in-memory against product id, SKU or barcode (instant) — only a miss falls back to a Firebase lookup</td><td>QR Sales / POS</td></tr>
              <tr><td>Stock Deduction on Sale</td><td>Checkout writes one Stock Out ledger entry per cart line (reason: Sale) — stock only ever changes via the ledger, never a direct qty edit</td><td>POS Checkout → Stock ledger</td></tr>
              <tr><td>Refund Total</td><td>Σ (qty × price) across the returned lines of a single return; each Return also credits stock back via a Stock In entry (reason: Return)</td><td>Return, Sales History "Returned" column</td></tr>
              <tr><td>Returnable Qty</td><td>Sold Qty − Σ qty already returned against that sale line (across all prior returns) — caps how much can be returned again</td><td>Process Return</td></tr>
              <tr><td>Suggested Reorder Qty</td><td>Reorder Qty if set, else max(0, Max Stock − Qty On Hand), else max(0, Reorder Level × 2 − Qty On Hand)</td><td>Reorder Report</td></tr>
              <tr><td>Product Status</td><td>active / discontinued — discontinued items stay in history &amp; reports but can be filtered out of the working list (delete only as a last resort)</td><td>Products list &amp; Status filter</td></tr>
              <tr><td>Effective Tax Rate (product)</td><td>Product Tax Rate % if set, otherwise the Settings default tax rate</td><td>Product (POS tax uses it next)</td></tr>
              <tr><td>Currency Display</td><td>money() prefixes the configured currency symbol (Settings → Currency &amp; Tax); all amounts app-wide follow it</td><td>Every amount shown</td></tr>
              <tr><td>Categories</td><td>Loaded live from the Categories collection (Settings), not a fixed list — add/remove to fit the business</td><td>Product/Record category dropdowns &amp; filters</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div className="about-card about-developer">
        <h2><i className="fas fa-code"></i> About the Developer</h2>
        <div className="developer-info">
          <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjPDI5pu2UTjyZ4StRhL02eKFqp1Adn2UCSygYbkogv8IcOBRUNsPK6J9aY68FRB6MsweUMlUg9zpAZzGSibiI-PZ8qAMQuihSpgo_7d35kiJBMQFe8m6wvvJmSl4z9sUIMEPHGQBBxtdc-VUylt7omPMI6C72wz6vNF0tKNPOQEuncQg/s1600/498147266_4277352909158791_6036352941346477170_n.jpg" alt="Dwi Prasetyo" className="developer-avatar" />

// --- Settings (Admin) - business profile, currency, tax, receipt text, categories ---
function SettingsView({ user, role }) {
  const { settings, categories, refreshConfig } = useConfig();
  const [form, setForm] = useState(settings || {});
  const [newCat, setNewCat] = useState('');
  const [saving, setSaving] = useState(false);
  const [load, setLoad] = useState('');
  const [rolePerms, setRolePerms] = useState(() => ({
    User: Object.assign({}, DEFAULT_ROLE_PERMISSIONS.User, (settings && settings.rolePermissions && settings.rolePermissions.User) || {}),
    Viewer: Object.assign({}, DEFAULT_ROLE_PERMISSIONS.Viewer, (settings && settings.rolePermissions && settings.rolePermissions.Viewer) || {})
  }));
  const [savingPerms, setSavingPerms] = useState(false);

  useEffect(() => { setForm(settings || {}); }, [settings]);
  useEffect(() => {
    setRolePerms({
      User: Object.assign({}, DEFAULT_ROLE_PERMISSIONS.User, (settings && settings.rolePermissions && settings.rolePermissions.User) || {}),
      Viewer: Object.assign({}, DEFAULT_ROLE_PERMISSIONS.Viewer, (settings && settings.rolePermissions && settings.rolePermissions.Viewer) || {})
    });
  }, [settings]);
  const upd = (k, v) => setForm(f => Object.assign({}, f, { [k]: v }));
  const togglePerm = (roleKey, permKey) => setRolePerms(p => Object.assign({}, p, { [roleKey]: Object.assign({}, p[roleKey], { [permKey]: !p[roleKey][permKey] }) }));
  const savePermissions = async () => {
    setSavingPerms(true);
    const r = await fbSaveSettings({ rolePermissions: rolePerms }, user);
    setSavingPerms(false);
    if (r.success) { refreshConfig(); Swal.fire({ icon: 'success', title: 'Saved', text: 'Permissions updated', timer: 1600, showConfirmButton: false }); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };

  const save = async () => {
    setSaving(true);
    const payload = {
      businessName: form.businessName || '', address: form.address || '', phone: form.phone || '', email: form.email || '', logoUrl: form.logoUrl || '',
      currencySymbol: form.currencySymbol || 'Rp', currencyCode: form.currencyCode || 'IDR',
      taxRate: Number(form.taxRate) || 0, taxInclusive: !!form.taxInclusive,
      invoicePrefix: form.invoicePrefix || 'INV-', lowStockDefault: Number(form.lowStockDefault) || 0,
      receiptHeader: form.receiptHeader || '', receiptFooter: form.receiptFooter || ''
    };
    const r = await fbSaveSettings(payload, user);
    setSaving(false);
    if (r.success) { applySettings(payload); refreshConfig(); Swal.fire({ icon: 'success', title: 'Saved', text: 'Settings updated', timer: 1600, showConfirmButton: false }); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };

  const addCat = async () => {
    const nm = newCat.trim(); if (!nm) return;
    setLoad('Adding category...');
    const r = await fbAddCategory(nm, user); setLoad('');
    if (r.success) { setNewCat(''); refreshConfig(); } else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };
  const delCat = (c) => Swal.fire({ icon: 'warning', title: 'Delete category?', text: c.name, showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (res) => {
    if (!res.isConfirmed) return;
    setLoad('Deleting...'); const r = await fbDeleteCategory(c.id, c.name, user); setLoad('');
    if (r.success) refreshConfig(); else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  });

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-gear"></i> Settings</h2>
        <div className="header-actions">
          <button className="btn btn-primary" title="Save Settings" onClick={save} disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> <span className="btn-label">Saving...</span></> : <><i className="fas fa-save"></i> <span className="btn-label">Save Settings</span></>}</button>
        </div>
      </div>

      <LteCard title="Business Info" icon="fa-store">
        <div className="form-grid">
          <div className="form-group"><label>Business Name</label><input type="text" value={form.businessName || ''} onChange={(e) => upd('businessName', e.target.value)} /></div>
          <div className="form-group"><label>Phone</label><input type="text" value={form.phone || ''} onChange={(e) => upd('phone', e.target.value)} /></div>
          <div className="form-group"><label>Email</label><input type="email" value={form.email || ''} onChange={(e) => upd('email', e.target.value)} /></div>
          <div className="form-group"><label>Logo URL</label><input type="text" value={form.logoUrl || ''} onChange={(e) => upd('logoUrl', e.target.value)} placeholder="https://..." /></div>
        </div>
        <div className="form-group"><label>Address</label><textarea rows="2" value={form.address || ''} onChange={(e) => upd('address', e.target.value)}></textarea></div>
      </LteCard>

      <LteCard title="Currency & Tax" icon="fa-coins">
        <div className="form-grid">
          <div className="form-group"><label>Currency Symbol</label><input type="text" value={form.currencySymbol || ''} onChange={(e) => upd('currencySymbol', e.target.value)} placeholder="Rp, $, ₹, £..." /></div>
          <div className="form-group"><label>Currency Code</label><input type="text" value={form.currencyCode || ''} onChange={(e) => upd('currencyCode', e.target.value)} placeholder="IDR, USD, INR..." /></div>
          <div className="form-group"><label>Default Tax Rate (%)</label><input type="number" step="0.01" min="0" value={form.taxRate ?? ''} onChange={(e) => upd('taxRate', e.target.value)} /></div>
          <div className="form-group"><label>Low Stock Default</label><input type="number" step="1" min="0" value={form.lowStockDefault ?? ''} onChange={(e) => upd('lowStockDefault', e.target.value)} /></div>
          <div className="form-group"><label><i className="fas fa-toggle-on"></i> Prices Include Tax</label><div><input type="checkbox" className="toggle" checked={!!form.taxInclusive} onChange={(e) => upd('taxInclusive', e.target.checked)} /></div></div>
        </div>
      </LteCard>

      <LteCard title="Receipt / Invoice" icon="fa-receipt">
        <div className="form-grid">
          <div className="form-group"><label>Invoice Prefix</label><input type="text" value={form.invoicePrefix || ''} onChange={(e) => upd('invoicePrefix', e.target.value)} placeholder="INV-" /></div>
        </div>
        <div className="form-group"><label>Receipt Header</label><textarea rows="2" value={form.receiptHeader || ''} onChange={(e) => upd('receiptHeader', e.target.value)} placeholder="Shown above receipt items"></textarea></div>
        <div className="form-group"><label>Receipt Footer</label><textarea rows="2" value={form.receiptFooter || ''} onChange={(e) => upd('receiptFooter', e.target.value)} placeholder="Thank you message"></textarea></div>
      </LteCard>

      <LteCard title="Product Categories" icon="fa-tags">
        <div className="pos-scan-box" style={{ marginBottom: 14 }}>
          <div className="form-group" style={{ flex: 1, marginBottom: 0 }}><label>New Category</label><input type="text" value={newCat} onChange={(e) => setNewCat(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addCat(); } }} placeholder="e.g. Beverages" /></div>
          <button className="btn btn-success" onClick={addCat}><i className="fas fa-plus"></i> Add</button>
        </div>
        <div className="cat-chip-wrap">
          {categories.length === 0 ? <p style={{ color: '#999' }}>No categories yet.</p> : categories.map(c => (
            <span className="cat-chip" key={c.id}><i className="fas fa-tag"></i> {c.name}<button onClick={() => delCat(c)} title="Delete"><i className="fas fa-times"></i></button></span>
          ))}
        </div>
      </LteCard>

      <LteCard title="Role Permissions" icon="fa-user-lock">
        <p style={{ color: '#666', marginBottom: 14 }}>Turn action buttons on or off for the <strong>User</strong> and <strong>Viewer</strong> roles. Admin always has full access. Viewer stays limited to Products / Expenses / About App no matter what's toggled here.</p>
        <div className="about-table-wrapper">
          <table className="about-roles-table">
            <thead><tr><th>Action</th><th style={{ textAlign: 'center' }}>User</th><th style={{ textAlign: 'center' }}>Viewer</th></tr></thead>
            <tbody>
              {PERMISSION_DEFS.map(p => (
                <tr key={p.key}>
                  <td>{p.label}<div className="cell-sub">{p.module}</div></td>
                  <td style={{ textAlign: 'center' }}><input type="checkbox" checked={!!rolePerms.User[p.key]} onChange={() => togglePerm('User', p.key)} /></td>
                  <td style={{ textAlign: 'center' }}><input type="checkbox" checked={!!rolePerms.Viewer[p.key]} onChange={() => togglePerm('Viewer', p.key)} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="form-actions" style={{ marginTop: 14 }}>
          <button type="button" className="btn btn-primary" disabled={savingPerms} onClick={savePermissions}><i className="fas fa-save"></i> Save Permissions</button>
        </div>
      </LteCard>
    </div>
  );
}

// --- Layout ---
function MainContent({ activeMenu, user, role, setActiveMenu }) {
  switch (activeMenu) {
    case 'dashboard': return <DashboardView user={user} role={role} setActiveMenu={setActiveMenu} />;
    case 'pos': return <POSView user={user} role={role} />;
    case 'products': return <ProductsView user={user} role={role} />;
    case 'stock': return <StockView user={user} role={role} />;
    case 'sales-history': return <SalesHistoryView user={user} role={role} />;
    case 'records': return <RecordsView user={user} role={role} />;
    case 'suppliers': return <SuppliersView user={user} role={role} />;
    case 'purchase-orders': return <PurchaseOrdersView user={user} role={role} />;
    case 'recipes': return <RecipesView user={user} role={role} />;
    case 'expenses': return <ExpensesView user={user} role={role} />;
    case 'users': return <UsersView user={user} role={role} />;
    case 'settings': return <SettingsView user={user} role={role} />;
    case 'logs': return <LogsView />;
    case 'about': return <AboutView />;
    default: return null;
  }
}

function Dashboard({ user, role, onLogout }) {
  const [activeMenu, setActiveMenu] = useState(role === 'Admin' ? 'dashboard' : role === 'Viewer' ? 'products' : 'records');
  const [collapsed, setCollapsed] = useState(() => localStorage.getItem('sb_collapsed') === '1');
  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
  const toggleSidebar = () => {
    setCollapsed(c => { localStorage.setItem('sb_collapsed', c ? '0' : '1'); return !c; });
    setMobileSidebarOpen(o => !o);
  };
  useEffect(() => { setMobileSidebarOpen(false); }, [activeMenu]); // close the mobile drawer whenever the user navigates
  useEffect(() => { if (role === 'Viewer' && !['products', 'expenses', 'about'].includes(activeMenu)) setActiveMenu('products'); }, [role, activeMenu]);
  const [quickScanOpen, setQuickScanOpen] = useState(false);
  const { data: logsData } = useFetch(() => fbGetLogs(), [activeMenu]);
  const notifs = useMemo(() => (logsData && logsData.success ? logsData.data.slice(0, 5).map(l => ({ text: `${l.action}: ${l.detail}`, icon: 'fa-bell' })) : []), [logsData]);

  // app config (settings + categories) loaded once here, shared via context; mirrored into CFG for non-component code
  const [cfgKey, setCfgKey] = useState(0);
  const { data: cfgData } = useFetch(() => Promise.all([fbGetSettings(), fbGetCategories()]), [cfgKey]);
  const settings = useMemo(() => (cfgData && cfgData[0] && cfgData[0].success ? cfgData[0].data : {}), [cfgData]);
  const categories = useMemo(() => (cfgData && cfgData[1] && cfgData[1].success ? cfgData[1].data : []), [cfgData]);
  useEffect(() => { if (settings && Object.keys(settings).length) applySettings(settings); }, [settings]);
  const refreshConfig = useCallback(() => setCfgKey(k => k + 1), []);

  const titles = { dashboard: 'Dashboard', pos: 'QR Sales', products: 'Products', stock: 'Stock In/Out', 'sales-history': 'Sales History', records: 'Customers', suppliers: 'Suppliers', 'purchase-orders': 'Purchase Orders', recipes: 'Recipes', expenses: 'Expenses', users: 'Users', settings: 'Settings', logs: 'Activity Logs', about: 'About App' };
  const icons  = { dashboard: 'fa-chart-line', pos: 'fa-cash-register', products: 'fa-boxes-stacked', stock: 'fa-dolly', 'sales-history': 'fa-receipt', records: 'fa-address-book', suppliers: 'fa-truck-field', 'purchase-orders': 'fa-file-invoice-dollar', recipes: 'fa-book-open', expenses: 'fa-money-bill-trend-up', users: 'fa-users-cog', settings: 'fa-gear', logs: 'fa-history', about: 'fa-info-circle' };
  return (
    <ConfigContext.Provider value={{ settings, categories, refreshConfig }}>
      <div className="app-container">
        <Sidebar activeMenu={activeMenu} setActiveMenu={setActiveMenu} role={role} user={user} onLogout={onLogout} collapsed={collapsed} mobileOpen={mobileSidebarOpen} />
        <div className={'mobile-nav-backdrop' + (mobileSidebarOpen ? ' show' : '')} onClick={() => setMobileSidebarOpen(false)}></div>
        <div className="main-content">
          <Navbar icon={icons[activeMenu]} title={titles[activeMenu]} userName={user?.name} role={role} notifs={notifs} onLogout={onLogout} setActiveMenu={setActiveMenu} toggleSidebar={toggleSidebar} />
          <MainContent activeMenu={activeMenu} user={user} role={role} setActiveMenu={setActiveMenu} />
        </div>
        <BottomNav activeMenu={activeMenu} setActiveMenu={setActiveMenu} role={role} onMenuToggle={toggleSidebar} onQuickScan={() => setQuickScanOpen(true)} />
        {quickScanOpen && <QuickStockCheckModal onClose={() => setQuickScanOpen(false)} />}
      </div>
    </ConfigContext.Provider>
  );
}

function App() {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [userRole, setUserRole] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);

  useEffect(() => {
    const saved = localStorage.getItem('fb_user');
    if (saved) {
      try { const u = JSON.parse(saved); setIsLoggedIn(true); setCurrentUser(u); setUserRole(u.role); } catch (e) {}
    }
    setCheckingSession(false);
  }, []);

  const handleLogin = (user, role) => {
    localStorage.setItem('fb_user', JSON.stringify(user));
    setIsLoggedIn(true); setCurrentUser(user); setUserRole(role);
  };
  const handleLogout = () => {
    localStorage.removeItem('fb_user');
    setIsLoggedIn(false); setCurrentUser(null); setUserRole(null);
  };

  if (checkingSession) return <div className="login-container"><div className="login-box"><i className="fas fa-spinner fa-spin" style={{fontSize: '40px', color: 'var(--color-primary)'}}></i></div></div>;

  return <div>{!isLoggedIn ? <LoginPage onLogin={handleLogin} /> : <Dashboard user={currentUser} role={userRole} onLogout={handleLogout} />}</div>;
}

class ErrorBoundary extends React.Component {
  state = { err: null };
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { console.error('ui crash', err); }
  render() {
    if (this.state.err) return (
      <div className="login-container"><div className="login-box">
        <i className="fas fa-triangle-exclamation" style={{fontSize: 40, color: 'var(--danger)'}}></i>
        <h2>Something broke</h2>
        <button className="btn btn-primary" onClick={() => location.reload()}><i className="fas fa-rotate"></i> Reload</button>
      </div></div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
